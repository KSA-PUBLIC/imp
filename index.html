let importedKcsi={};
const LSKEY="kcsi-imp-form-v1";
const emptyState=()=>({basic:{},a:{},demo:false,step:-1});
let state=emptyState();try{const prior=JSON.parse(localStorage.getItem(LSKEY)||"null");if(prior&&typeof prior==="object")state={...emptyState(),...prior};}catch(e){}
const stage=document.getElementById("stage");
const h=(v)=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const data=(q)=>state.a[String(q)];
const optName=(a)=>typeof a==="string"?a:a.label;
const shortIssue=(index)=>ISSUES[Number(index)]?.name||"미선택";
const sel=(title,choices,value,attrs="")=>`<select class="select-input" ${attrs}><option value="">${h(title)}</option>${choices.map(x=>`<option ${value===String(x)?"selected":""} value="${h(x)}">${h(x)}</option>`).join("")}</select>`;
const save=()=>{try{localStorage.setItem(LSKEY,JSON.stringify(state));}catch(e){}};
const sectionFor=(step)=>SEGMENTS.find(s=>step>=s.start&&step<=s.end)?.name||"";
function renderSidebar(){document.getElementById("step-names").innerHTML=SEGMENTS.map(s=>`<div class="step-line ${state.step>=s.start&&state.step<=s.end?"active":state.step>s.end?"done":""}">${h(s.name)}</div>`).join("");}
function extraField(q,group=null){const choice=group===null?data(q):(data(q)||{})[group];if(!((typeof choice==="string"&&choice.includes("기타"))||(Array.isArray(choice)&&choice.some(x=>x.includes("기타")))))return "";const key=group===null?`extra-${q}`:`extra-${q}-${group}`;return `<div class="field"><label>기타 내용(선택 입력)</label><input class="text-input" data-extra="${h(key)}" value="${h(state.a[key]||"")}" placeholder="구체적인 내용을 입력해 주세요"></div>`;}
function answerText(q){let v=data(q)||"";let extra=state.a[`extra-${q}`];return typeof v==="string"&&v.includes("기타")&&extra?extra:v;}
function perStakeText(q,stake){const v=(data(q)||{})[stake]||"";let extra=state.a[`extra-${q}-${stake}`];return v.includes("기타")&&extra?extra:v;}
function optionsHtml(q,arr,type="radio",max=null,namePrefix=null,desc=false){const val=data(q);let array=Array.isArray(val)?val:[];return `<div class="choices">${arr.map((v,i)=>{let value=typeof v==="string"?v:v.value;let label=typeof v==="string"?v:v.label;let more=typeof v==="string"?"":v.desc;let checked=(type==="checkbox"?array.includes(value):val===value);return `<label class="choice ${checked?"selected":""}"><input type="${type}" name="q${q}" data-q="${q}" value="${h(value)}" ${checked?"checked":""}><span class="opt-copy">${h(label)}${(desc&&more)?`<span class="sub">${h(more)}</span>`:""}</span></label>`}).join("")}</div>${max?`<p class="note">최대 ${max}개 선택</p>`:""}`;}
function introHTML(){return `<div class="slide"><div class="eyebrow">시작하기 · 기본정보</div><h2 class="qtitle">지역과 기관의 기본정보를 입력해 주세요.</h2><p class="qdesc">아래 7개 정보는 진단 30문항에 포함되지 않습니다. 활동 지역과 기관 소재지를 구분해 주세요.</p>
<div class="notice">지역 K-CSI 점수는 이 설문에서 다시 산출하지 않습니다. 실제 지역별 원자료가 연결되지 않은 경우 결과지에는 '지역 데이터 미연결'이라고 표시됩니다.</div>
<div class="field"><label class="required">B1. 기관·기업명</label><input class="text-input" data-basic="name" maxlength="120" value="${h(state.basic.name||"")}" placeholder="공식 기관·기업명"></div>

function issueGoalsHTML(){const a=activeIssues();if(!a.length)return `<div class="notice">Q5에서 이슈 선택이 어려운 경우에는 이 문항도 판단 보류됩니다. 대표 활동·Outcome을 기준으로 결과에서 후보만 제시합니다.</div>`;const map=data(9)||{};const preferred=data(8)||[];return `<div class="notice">아래 선택지는 6대 목표 전체입니다. <b>미산출</b> 표시는 해당 조합의 시군구 K-CSI 점수가 없다는 뜻이며, 기관의 활동 가능성이 없다는 의미는 아닙니다.</div>${a.map(i=>`<div class="group-card"><h4>${h(ISSUES[i].name)} ${i===primaryIssue()?'<span class="pill">주요 이슈</span>':''}</h4><p>이 이슈가 어떤 목표에 기여하는지 실제 활동의 목적과 수혜자 변화에 따라 판단하세요.</p><div class="choice-row">${GOALS.map(g=>`<label class="choice ${String(map[i])===String(g.id)?"selected":""}"><input type="radio" name="q9-${i}" data-q="9" data-group="${i}" value="${g.id}" ${String(map[i])===String(g.id)?"checked":""}><span class="opt-copy">${h(g.name)} ${preferred.includes(String(g.id))?' · Q8 선택':''} ${ISSUES[i].matrix[g.id]===null?'<span class="pill muted">시군구 미산출</span>':''}<span class="sub">${h(g.desc)}</span></span></label>`).join("")}</div></div>`).join("")}`;}

function recommended(){const base=primaryIssue()===null?["지역주민","가족·보호자","협력업체·공급업체"]:ISSUES[selectedIssuesForBranch()].stakeholders;let extra=[...base];const indirect=data(20)||[];if(indirect.includes(INDIRECT[0]))extra.push("협력업체·공급업체","소상공인·자영업자");if(indirect.includes(INDIRECT[1]))extra.push("가족·보호자","임직원·근로자");if(indirect.includes(INDIRECT[2]))extra.push("고객·서비스 이용자","지역주민");if(indirect.includes(INDIRECT[3]))extra.push("공공기관·지방자치단체","지역사회단체·비영리기관");if(indirect.includes(INDIRECT[4]))extra.push("지역주민","지역사회단체·비영리기관");if(indirect.includes(INDIRECT[5]))extra.push("지역주민","고령자·장애인 등 특정 지원대상");if(indirect.includes(INDIRECT[6]))extra.push("자연환경·생태계");if(indirect.includes(INDIRECT[7]))extra.push("인근 기존 사업자","임직원·근로자");return [...new Set(extra)].filter(x=>!(data(17)||[]).includes(x)).slice(0,5);}

function perStakeHTML(q,def){const groups=groupStakeholders(def.stakeSource);const m=data(q)||{};if(!groups.length)return `<div class="notice">앞선 응답에서 해당하는 이해관계자가 선택되지 않았습니다. 이 문항은 건너뛰어도 됩니다.</div>`;return `${def.stakeSource==="all"?'<div class="notice">직접·추가 이해관계자 중 우선 3개 집단을 상세 분석합니다.</div>':''}${groups.map(s=>`<div class="group-card"><h4>${h(s)} ${newStakeholders().includes(s)?'<span class="pill muted">추가 인식</span>':''}</h4><div class="choice-row">${def.options.map(v=>`<label class="choice ${m[s]===v?"selected":""}"><input type="radio" name="q${q}-${h(s)}" data-q="${q}" data-group="${h(s)}" value="${h(v)}" ${m[s]===v?"checked":""}><span>${h(v)}</span></label>`).join("")}</div>${extraField(q,s)}</div>`).join("")}`;}

function renderQuestion(q){const def=Q[q],section=sectionFor(q-1);let body="";switch(def.type){case"text":body=`<div class="field"><input class="text-input" data-q="${q}" placeholder="${h(def.placeholder||"")}" value="${h(data(q)||"")}" maxlength="300"></div>`;break;case"radio":body=optionsHtml(q,def.options)+extraField(q);break;case"multi":body=optionsHtml(q,def.options,"checkbox",def.max)+extraField(q);break;case"issue":body=issueRadios(q,false);break;case"issue-multi":body=issueRadios(q,true);break;case"goals":body=goalsOptions();break;case"problem":body=issueChoice(q,"problems");break;case"outcome":body=issueChoice(q,"outcomes");break;case"impact":body=issueChoice(q,"impacts");break;case"issue-goal":body=issueGoalsHTML();break;case"stake-multi":body=stakeholderHTML(q);break;case"per-stake":body=perStakeHTML(q,def);break;case"suggested":body=suggestedHTML();break;case"negative":body=negativeHTML();break;}

function valid(){if(state.step===-1){let b=state.basic;return b.name&&b.orgType&&b.hqProvince&&b.hqDistrict&&b.areaProvince&&b.areaDistrict?"":"기관명, 조직 유형, 기관 소재지 및 대표 활동 지역을 입력해 주세요.";}if(state.step===30)return "";let q=state.step+1,d=Q[q],v=data(q);if(q===6||q===21)return "";if(q===9){return activeIssues().every(i=>(data(9)||{})[i]!==undefined)?"":"선택한 이슈별 연계 목표를 각각 한 개씩 선택해 주세요.";}if(d.type==="per-stake"){let groups=groupStakeholders(d.stakeSource);if(!groups.length)return "";return groups.every(s=>v&&v[s])?"":"각 이해관계자에 대한 답변을 선택해 주세요.";}if(d.type==="multi"||d.type==="stake-multi"||d.type==="goals"||d.type==="issue-multi"||d.type==="negative")return Array.isArray(v)&&v.length?"":"선택지를 하나 이상 선택해 주세요.";return v!==undefined&&String(v).trim()!==""?"":"답변을 입력하거나 선택해 주세요.";}

function setAnswer(q,value,group=null,isCheckbox=false){q=Number(q);if(group!==null){const curr=data(q)||{};state.a[q]={...curr,[group]:value};}else if(isCheckbox){let curr=Array.isArray(data(q))?[...data(q)]:[];if(curr.includes(value))curr=curr.filter(x=>x!==value);else{const max=Q[q]?.max||((q===6||q===17)?2:null);if(max&&curr.length>=max){alert(`최대 ${max}개까지 선택할 수 있습니다.`);render();return;}
const noExclusive=(q===20?INDIRECT[8]:q===29?Q[29].options[6]:null);if(noExclusive){if(value===noExclusive)curr=[];else curr=curr.filter(x=>x!==noExclusive);}if(q===29&&value===Q[29].options[7])curr=[];if(q===29&&value!==Q[29].options[7])curr=curr.filter(x=>x!==Q[29].options[7]);curr.push(value);}state.a[q]=curr;}else state.a[q]=value;

if(q===21){for(let k of [22,23,24,25,26,27])state.a[k]={};}
save();render();}

function indicatorFor(v){if(!v)return"향후 관찰·확인할 성과지표 선정 필요";if(/판매|소득|거래|경제활동|고용|창업/.test(v))return"경제활동·판매 참여 경험, 신규 거래 기회 또는 고용 변화 여부";if(/교육|직무|역량|지식|기술|진로/.test(v))return"학습·훈련 참여 전후 역량 인식 및 활용 경험";if(/돌봄|시간|부담|업무|비용/.test(v))return"시간·비용·돌봄 부담의 변화 여부 및 당사자 의견";if(/서비스|시설|접근성|이용/.test(v))return"서비스·시설 접근·이용 경험과 만족도";if(/건강|안전|생활 안정/.test(v))return"건강·안전 체감 및 관련 생활여건의 변화";if(/환경|자원|생태/.test(v))return"환경 상태·자원 이용 방식의 변화와 관련 관찰자료";if(/관계|참여|협력|소속감/.test(v))return"교류·협력·참여 경험 및 관계 변화";return"이해관계자 변화 여부 및 구체적인 사례 확인";}
function resultHTML(){const kc=getKcsi(),b=state.basic,ma=mappedCells(),primary=ma.find(m=>m.primary),region=[b.areaProvince,b.areaDistrict].filter(Boolean).join(" "),dStake=detailedStakeholders(),more=newStakeholders(),stmap=data(21)||{},outcome=data(13)||"핵심 Outcome 미선택",primaryObj=ISSUES[selectedIssuesForBranch()],weak=[];if(kc){ISSUES.forEach((it,i)=>it.matrix.forEach((v,j)=>{if(v!==null&&cellStatus(kc,i,j)==="weak")weak.push({i,j});}));}const mappedSet=new Set(ma.map(m=>`${m.i}-${m.j}`));const kcInfo=kc?`<span class="k-score">${kc.overall==null?"미제공":h(kc.overall)}</span><p class="note">${kc.demo?"가상 시연 점수 · 실제 지역 지수가 아님": "연결된 K-CSI 원자료의 종합 상대지수"}</p>`:`<b>지역 K-CSI 데이터 미연결</b><p class="note">지역 원자료 JSON을 연결하면 지역의 강점·취약 셀을 표시합니다. 현재는 기관의 활동 셀만 확인할 수 있습니다.</p>`;
const sRows=dStake.map(s=>{const v=(data(19)||{})[s]?perStakeText(19,s):((data(22)||{})[s]?perStakeText(22,s):"구체적 변화 미확인"),ver=(data(25)||{})[s]||"근거 미입력",isNew=more.includes(s);return `<tr><td>${h(s)}<br><span class="pill ${isNew?"muted":""}">${isNew?"추가 인식":"기존 인식"}</span></td><td>${h(v)}<div class="note">추천 지표: ${h(indicatorFor(v))}</div></td><td><span class="${ratingPill(ver)}">${h(ver)}</span><div class="note">${h((data(23)||{})[s]||"영향방향 미입력")}</div></td></tr>`}).join("");
return `<div class="result slide"><div class="report-top"><small>K-CSI × IMP · 기관별 간이진단 결과보고서</small><h2>우리 지역의 지속가능성, 우리 기관이 창출하는 변화</h2><p>지역 K-CSI 현황 → 기관의 기여영역 → 변화창출구조 → 이해관계자별 변화</p><div class="report-meta"><div><small>기관명</small>${display(b.name)}</div><div><small>활동 지역</small>${display(region)}</div><div><small>조직 유형</small>${display(b.orgType)}</div><div><small>대표 활동</small>${display(data(2))}</div></div></div>
${state.demo?'<div class="notice">현재 <b>시연용 가상 K-CSI 데이터</b>가 적용되어 있습니다. 강점·취약 색상과 종합점수 42.6은 실제 지역 통계가 아닙니다.</div>':!kc?'<div class="notice">이 지역의 K-CSI 셀별 점수가 연결되지 않았습니다. 결과의 강점·취약 판단과 기여-취약 교차 분석은 보류합니다.</div>':''}
<section class="section"><div class="section-tag">01 / 지역 현황</div><h3 class="section-head">우리 지역의 지속가능성 수준</h3><div class="metrics"><div class="metric"><small>K-CSI 종합지수</small>${kcInfo}</div><div class="metric"><small>72개 교차영역</small><strong>72셀</strong><div class="note">12대 이슈 × 6대 목표</div></div><div class="metric"><small>시군구 산출 활성 셀</small><strong>52셀</strong><div class="note">보고서 매트릭스 기준</div></div></div>${kc&&Array.isArray(kc.goals)&&kc.goals.some(x=>typeof x==="number")?`<h4>6대 목표별 기존 K-CSI 데이터</h4>${GOALS.map((g,j)=>`<div class="goal-row"><span>${h(g.name)}</span><div class="goal-track"><div class="goal-fill" style="width:${Math.max(0,Math.min(100,Number(kc.goals[j])||0))}%"></div></div><b>${kc.goals[j]==null?"미제공":h(kc.goals[j])}</b></div>`).join("")}<p class="note">6대 목표 점수의 시각화 범위 및 척도는 공급 데이터 사양에 맞게 검증해야 합니다.</p>`:""}</section>
<section class="section"><div class="section-tag">02 / 지역과 기관의 연결</div><h3 class="section-head">K-CSI 72셀 × 우리 기관의 기여영역</h3><p class="muted" style="font-size:13px">가로는 지속가능성 6대 목표, 세로는 12대 이슈입니다. 체크는 기관 활동과 개념적으로 연관된 셀이며 해당 지역 점수의 개선을 입증하지 않습니다.</p>${matrixHTML(kc)}<div class="legend"><span><i class="swatch" style="background:var(--strong)"></i>상대적 강점</span><span><i class="swatch" style="background:var(--medium)"></i>중간</span><span><i class="swatch" style="background:var(--weak)"></i>상대적 취약</span><span><i class="swatch" style="background:var(--blank)"></i>시군구 미산출</span><span><i class="swatch" style="border:3px solid #226cc8"></i>기관 기여</span></div><div class="insight"><strong>기관의 기여영역</strong>${ma.length?ma.map(m=>`<p>${m.primary?"주요":"추가"} 기여 후보: <b>${h(ISSUES[m.i].name)} × ${h(GOALS[m.j].name)}</b> ${ISSUES[m.i].matrix[m.j]===null?'<span class="pill muted">시군구 미산출</span>':''}</p>`).join(""):"셀 매핑 보류: 관련 이슈·목표 선택을 확인해 주세요."}<p class="note">이 위치는 활동 목적과 응답 내용에 근거한 자기보고식 매핑입니다. ISO 세부 셀 정의와의 최종 정합성 검토를 거쳐 확정해야 합니다.</p></div></section>
<section class="section"><div class="section-tag">03 / 지역 취약·공백</div><h3 class="section-head">지역의 취약영역과 기관 기여 비교</h3>${!kc?'<div class="notice">실제 지역 K-CSI 셀별 점수·비교기준이 없어 취약영역 목록을 생성하지 않았습니다.</div>':`<table class="info-table"><thead><tr><th>지역 취약 셀</th><th>본 기관 기여</th></tr></thead><tbody>${weak.slice(0,6).map(x=>`<tr><td>${h(ISSUES[x.i].name)} × ${h(GOALS[x.j].name)}</td><td>${mappedSet.has(`${x.i}-${x.j}`)?"기관 활동과 관련됨":"본 기관의 대표 활동에서 미확인"}</td></tr>`).join("")||'<tr><td colspan="2">연결된 데이터에서 취약으로 분류된 셀이 없습니다.</td></tr>'}</tbody></table><p class="note">${kc.demo?"위 셀들은 시연용 가상 분류입니다.":"취약 분류는 외부에서 검증하여 입력한 원자료 분류를 그대로 사용합니다."} 본 기관에서 활동이 확인되지 않았다는 뜻이지, 지역 내 모든 기관이 활동하지 않는다는 뜻은 아닙니다.</p>`}</section>
<section class="section"><div class="section-tag">04 / IMP 변화창출구조</div><h3 class="section-head">대표 활동이 만드는 변화</h3><div class="flow-step dark"><div class="kicker">IMPACT · 장기적 영향</div><strong>${display(answerText(15),"장기 영향 미선택")}</strong><div class="note" style="color:#c6d9e8">기대하는 장기적 지역사회 영향 · 검증된 성과 아님</div></div><div class="flow-arrow">↑</div><div class="flow-step highlight"><div class="kicker">OUTCOME · 핵심 변화</div><strong>${display(outcome)}</strong><div class="note">${display(data(14),"발생 상태 미확인")}</div></div><div class="flow-arrow">↑</div><div class="flow-step"><div class="kicker">OUTPUT · 직접 성과</div><strong>${display(answerText(11))}</strong><div class="note">${display(data(12),"실행 상태 미확인")}</div></div><div class="flow-arrow">↑</div><div class="flow-step"><div class="kicker">ACTIVITY · 대표 활동</div><strong>${display(data(2))}</strong><div class="note">${display(answerText(10),"역할 미확인")}</div></div><div class="insight"><strong>변화가 발생하는 주요 경로</strong><p>${display(answerText(16))}</p></div></section>
<section class="section"><div class="section-tag">05 / 이해관계자별 영향</div><h3 class="section-head">누구에게 어떤 변화가 나타났는가?</h3><table class="info-table"><thead><tr><th>대상</th><th>하위 Outcome 및 추천 측정지표</th><th>확인 근거·방향</th></tr></thead><tbody>${sRows||'<tr><td colspan="3">이해관계자 응답이 없습니다.</td></tr>'}</tbody></table>${newStakeholders().length?`<div class="insight"><strong>숨은 이해관계자 탐색</strong><p>기존 인식 외에 ${newStakeholders().map(h).join(", ")}를 영향 가능 대상에 추가했습니다. '가능성 있음'으로 선택한 대상의 변화는 추정 단계이며 추가 확인이 필요합니다.</p></div>`:`<div class="insight"><strong>숨은 이해관계자 탐색</strong><p>응답에 따라 추가 영향 가능 대상이 확인되지 않았거나 판단이 보류되었습니다.</p></div>`}</section>
<section class="section"><div class="section-tag">06 / IMP 5차원</div><h3 class="section-head">변화의 내용·범위·기여·위험</h3><table class="info-table"><tbody><tr><th style="width:30%">What · 어떤 변화?</th><td>${display(outcome)}<div class="note">변화 확인: ${display(data(14))}</div></td></tr><tr><th>Who · 누구에게?</th><td>${dStake.map(h).join(", ")||"대상 미확인"}</td></tr><tr><th>How Much · 어느 정도?</th><td>${dStake.map(s=>`<b>${h(s)}</b>: ${h((data(26)||{})[s]||"정도 미확인")} / ${h((data(27)||{})[s]||"지속성 미확인")}`).join("<br>")}<div class="note">범위·규모(수혜자 수 등) 미측정. 정성적 판단만 포함</div></td></tr><tr><th>Contribution · 기여?</th><td>${display(data(28))}<div class="note">기관 자기평가로, 인과효과 미검증</div></td></tr><tr><th>Risk · 부정적 영향?</th><td>${(data(29)||[]).map(h).join(" / ")||"미응답"}<div class="note">발생 상태: ${display(state.a.q29status,"미입력")}</div></td></tr></tbody></table></section>
<section class="section"><div class="section-tag">07 / 다음 단계</div><h3 class="section-head">종합 의견 및 관리과제</h3><div class="insight"><strong>진단 종합</strong><p>${display(b.name,"본 기관")}의 대표 활동은 ${ma.length?ma.map(m=>`${h(ISSUES[m.i].name)} × ${h(GOALS[m.j].name)}`).join(", "):"K-CSI 관련 셀(확인 필요)"}과 개념적으로 연관될 수 있습니다. 핵심 변화는 '${display(outcome)}'로 응답되었습니다. 이는 기관 자체 보고에 기반한 진단이며 지역 K-CSI 점수의 변화를 증명하지는 않습니다.</p></div><h4>우선 보완과제</h4><ul>${(data(30)||[]).map(x=>`<li>${h(x)}</li>`).join("")||"<li>미입력</li>"}</ul><div class="footer-note"><b>해석상의 주의</b><br>① '시군구 미산출 셀'은 지역의 취약성을 뜻하지 않습니다. ② 기관 기여 셀은 활동의 관련 위치이며 성과의 인과효과는 아닙니다. ③ 응답기관에서 미확인된 활동이 지역 전체에도 없다는 뜻은 아닙니다. ④ 수혜자별 정성 답변은 IMP 공식 점수나 임팩트 총량이 아닙니다. ⑤ 시연 데이터는 실제 지역 비교·정책 판단에 활용할 수 없습니다.</div></section>
